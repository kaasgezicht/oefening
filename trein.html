<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1e3b30">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Trein</title>
<link rel="stylesheet" href="css/trein.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><div class="title">Trein</div><div id="clock"></div><div id="stats"></div></div>
<div id="bar"><button id="btnHome" data-ic="home">Menu</button><button id="btnMenu" data-ic="gear">Settings</button><button id="btnBuild" data-ic="build">Build</button><button id="btnDrive" data-ic="trains">Trains</button><button id="btnGen" data-ic="generate">Generate</button><button id="btnMap" data-ic="map">Map</button><button id="btnSave" data-ic="save">Save</button></div>
<canvas id="mapOv" hidden></canvas>
<div id="planeUI" hidden><div id="plHud"></div><div id="plTop"><button id="plCam">📷 Chase</button><button id="plGear">Gear ▼</button><button id="plFlaps">Flaps 0</button><button id="plEasy" class="on">Assist</button><button id="plReset">Reset</button><button id="plExit">✕</button></div>
<div id="plLeft"><input id="plThr" type="range" min="0" max="100" value="0" aria-label="Throttle"><span>Throttle</span></div>
<div id="plRight"><div id="plStick"><div id="plKnob"></div></div><div class="plRow"><button id="plRudL">◀ Rudder</button><button id="plBrake">Brake</button><button id="plRudR">Rudder ▶</button></div></div></div>
<div id="mainMenu" hidden><div class="mm-card"><svg class="mm-logo" viewBox="0 0 320 120" aria-label="Trein"><defs><linearGradient id="lgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d68a"/><stop offset="1" stop-color="#b8873a"/></linearGradient></defs>
<g fill="#e9e3d6" opacity=".85"><circle cx="246" cy="22" r="9"/><circle cx="262" cy="14" r="12"/><circle cx="282" cy="10" r="9"/></g>
<g fill="url(#lgB)" stroke="#2a1a08" stroke-width="1.5"><rect x="214" y="44" width="56" height="26" rx="3"/><rect x="262" y="30" width="30" height="40" rx="2"/><rect x="226" y="30" width="10" height="16"/><path d="M204 70h96l-6 8h-86z"/></g>
<rect x="268" y="36" width="18" height="12" fill="#1e3b30"/><g fill="#b8483a" stroke="#2a1a08" stroke-width="1.5"><circle cx="226" cy="84" r="9"/><circle cx="252" cy="84" r="9"/><circle cx="282" cy="85" r="7"/></g>
<path d="M10 96h300" stroke="#c9a14a" stroke-width="3"/><path d="M14 102h292" stroke="#c9a14a" stroke-width="1.5" opacity=".6"/><g stroke="#7a5a2a" stroke-width="3"><path d="M18 94v10"/><path d="M34 94v10"/><path d="M50 94v10"/><path d="M66 94v10"/><path d="M82 94v10"/><path d="M98 94v10"/><path d="M114 94v10"/><path d="M130 94v10"/><path d="M146 94v10"/><path d="M162 94v10"/><path d="M178 94v10"/><path d="M194 94v10"/><path d="M210 94v10"/><path d="M226 94v10"/><path d="M242 94v10"/><path d="M258 94v10"/><path d="M274 94v10"/><path d="M290 94v10"/><path d="M306 94v10"/></g>
<text x="12" y="80" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="700" font-size="74" fill="url(#lgB)" stroke="#2a1a08" stroke-width="1.6" letter-spacing="1">Trein</text></svg>
<div class="mm-page" data-p="home"><button class="mm-b go" id="mmCont">Continue</button><button class="mm-b" id="mmNew">New game</button><button class="mm-b" id="mmSaves">Saves</button><button class="mm-b" id="mmQual">Quality</button><button class="mm-b" id="mmFly">Fly the Staggerwing</button><button class="mm-b" id="mmSet">All settings</button></div>
<div class="mm-page" data-p="new" hidden><div class="mm-h">New game</div>
 <div class="mm-row mm-chips" id="mmStyle"><button data-v="land">Land</button><button data-v="island">Island</button><button data-v="islands">Many islands</button></div>
 <canvas id="mmPrev" width="300" height="300"></canvas><div class="mm-note" id="mmPrevNote">Preview without rivers and lakes</div>
 <div class="mm-grid">
  <label>World size<select id="mmSize"><option value="2048">2 × 2 km</option><option value="4096">4 × 4 km</option><option value="8192">8 × 8 km</option><option value="16384">16 × 16 km (heavy)</option></select></label>
  <label>Seed<span class="mm-seed"><input id="mmSeed" type="number" min="1" max="99999"><button id="mmDice" title="Random seed">🎲</button></span></label>
  <label>Mountain height<input type="range" id="mm_maxHeight" min="80" max="1200" step="10"></label>
  <label>Mountain amount<input type="range" id="mm_mountains" min="0" max="1" step="0.01"></label>
  <label class="isl">Island size<input type="range" id="mm_landShare" min="0.15" max="0.85" step="0.01"></label>
  <label>Big mountains<input type="range" id="mm_bigMtns" min="0" max="3" step="1"></label>
  <label class="bm">Big mountain height<input type="range" id="mm_bigMtnHeight" min="200" max="3000" step="50"></label>
  <label class="bm">Big mountain base<input type="range" id="mm_bigMtnBase" min="400" max="6000" step="50"></label>
  <label class="bm">Peak → ridge<input type="range" id="mm_bigMtnLong" min="0" max="1" step="0.01"></label>
  <label>Villages<input type="range" id="mm_villages" min="0" max="12" step="1"></label>
 </div>
 <div class="mm-row"><button class="mm-b" id="mmBack1">Back</button><button class="mm-b go" id="mmStart">Start</button></div></div>
<div class="mm-page" data-p="saves" hidden><div class="mm-h">Saves</div><div class="mm-note" id="mmSaveInfo"></div><button class="mm-b" id="mmSaveNow">Save now</button><button class="mm-b" id="mmLoad">Load the last save</button><button class="mm-b" id="mmExport">Export save file</button><button class="mm-b" id="mmImport">Import save file</button><button class="mm-b" id="mmLog">Export debug log</button><button class="mm-b" id="mmBack2">Back</button></div>
<div class="mm-page" data-p="quality" hidden><div class="mm-h">Quality</div><div class="mm-row mm-chips" id="mmPreset"><button data-v="low">Low</button><button data-v="medium">Medium</button><button data-v="high">High</button></div>
 <div class="mm-grid"><label>Building detail distance<input type="range" id="mmq_kitLod" min="0.1" max="2" step="0.05"></label><label>Render scale<input type="range" id="mmq_renderScale" min="0.3" max="1" step="0.05"></label></div>
 <div class="mm-note">More in All settings › Quality.</div><button class="mm-b" id="mmBack3">Back</button></div>
</div></div><div id="mapBar" hidden><span id="mapTitle">Map</span><span id="mapLegend"></span><button id="mapClose">✕ Close map</button></div>
<button id="btnSound" class="corner" data-ic="soundOff">Sound off</button><button id="btnSky" class="corner" aria-label="Time, season and weather">10:30</button><button id="btnFF" class="corner" aria-label="Fast forward">1×</button>
<div id="skySheet" hidden>
  <h4>Time of day</h4><input type="range" id="skyTime" min="0" max="24" step="0.05">
  <div class="row2"><button data-speed="0" data-ic="pause">Paused</button><button data-speed="30" data-ic="play">Slow</button><button data-speed="120" data-ic="fast">Fast</button><button data-speed="400" data-ic="faster">Very fast</button></div>
  <h4>Season</h4><div class="row2"><button data-season="spring" data-ic="spring">Spring</button><button data-season="summer" data-ic="summer">Summer</button><button data-season="autumn" data-ic="autumn">Autumn</button><button data-season="winter" data-ic="winter">Winter</button></div>
  <h4>Weather</h4><div class="row2"><button data-wx="auto" data-ic="wxAuto">By itself</button><button data-wx="clear" data-ic="clear">Clear</button><button data-wx="fair" data-ic="fair">Fair</button><button data-wx="cloudy" data-ic="cloudy">Cloudy</button><button data-wx="mist" data-ic="mist">Mist</button><button data-wx="rain" data-ic="rain">Rain</button><button data-wx="storm" data-ic="storm">Storm</button><button data-wx="snow" data-ic="snow">Snow</button></div>
  <div class="foot"><button id="skyMusic" data-ic="music">Music on</button><button id="skyClose" data-ic="close">Close</button></div>
</div>
<canvas id="ovl"></canvas>
<div id="buildBar" hidden>
  <div class="modes tabs"><span class="seg"><button data-btab="track" data-ic="pieces" class="keepcap">Track</button><button data-btab="stations" data-ic="station" class="keepcap">Stations</button><button data-btab="roads" data-ic="roads" class="keepcap">Roads</button></span></div>
  <div class="modes sub" id="mTrackHow"><span class="seg"><button data-mode="pieces" data-ic="pieceKit" class="keepcap">Pieces</button><button data-mode="draw" data-ic="draw" class="keepcap">Draw</button><button data-mode="route" data-ic="route" class="keepcap">Route</button></span></div>
  <div id="buildInfo"></div>
  <div id="mPieces">
    <div class="chips"><span class="seg dir">
      <button data-dir="-2" title="Sharp left"><svg viewBox="0 0 24 24"><path d="M12 21V12a5 5 0 0 0-5-5H4M7 3 3 7l4 4"/></svg></button>
      <button data-dir="-1" title="Gentle left"><svg viewBox="0 0 24 24"><path d="M14 21c0-8-3-12-8-14M6 3 4 7.5 8.5 9"/></svg></button>
      <button data-dir="0" title="Straight"><svg viewBox="0 0 24 24"><path d="M12 21V4M7 9l5-5 5 5"/></svg></button>
      <button data-dir="1" title="Gentle right"><svg viewBox="0 0 24 24"><path d="M10 21c0-8 3-12 8-14M18 3l2 4.5L15.5 9"/></svg></button>
      <button data-dir="2" title="Sharp right"><svg viewBox="0 0 24 24"><path d="M12 21V12a5 5 0 0 1 5-5h3M17 3l4 4-4 4"/></svg></button></span>
      <span class="seg len"><button id="pLenMinus">−</button><span id="pLen">20 m</span><button id="pLenPlus">+</button></span>
      <span class="seg" id="pRot"><button id="pRotL" title="Turn start left">⟲</button><button id="pRotR" title="Turn start right">⟳</button></span></div>
    <div class="chips" id="pSlope"><span class="seg slope"><button data-slope="down2" title="Steep down">⇊</button><button data-slope="down" title="Down">↘</button><button data-slope="level" title="Level">→</button><button data-slope="auto" data-ic="follow">Follow the ground</button><button data-slope="up" title="Up">↗</button><button data-slope="up2" title="Steep up">⇈</button></span></div>
    <div class="tools"><button id="pNew" data-ic="newLine">New line</button><button id="pBranch" data-ic="junction">Junction</button><button id="pDemolish" data-ic="demolish">Demolish</button><button id="pPlace" class="go big keepcap" data-ic="place">Place</button></div>
  </div>
  <div id="mRoads" hidden><div class="chips"><span class="seg"><button data-rtool="build" data-ic="roads">Build road</button><button data-rtool="stop" data-ic="busStop">Bus stop</button><button data-rtool="remove" data-ic="eraser">Remove road or stop</button></span></div><div class="tools"><button id="rAddBus" class="go add" data-ic="bus">Add bus</button><button id="rAddDD" class="add" data-ic="bus">Add double-decker</button><button id="rAddLorry" class="add" data-ic="lorry">Add lorry (Opel Blitz)</button><button id="rBusList" data-ic="list">Bus list</button></div></div>
  <div id="mSignals" hidden><div class="chips"><span class="seg"><button data-sig="signal" data-ic="signals">Signal</button><button data-sig="station" data-ic="station">Station</button><button data-sig="longer" data-ic="longer">Longer platform</button><button data-sig="shorter" data-ic="shorter">Shorter platform</button><button data-sig="remove" data-ic="eraser">Remove signal or station</button></span></div></div>
  <div class="tools" id="bChoice" hidden><button id="cA" class="go">A</button><button id="cB">B</button><button id="cC">C</button></div>
  <div id="mRoute" hidden><div class="chips"><span class="seg"><button data-prefer="scenic" data-ic="roadBend">Scenic (hug the land)</button><button data-prefer="direct" data-ic="direct">Direct</button></span><button id="rClear" class="tog" data-ic="restart">Start the route over</button></div></div>
  <div class="chips" id="bTrackOpts"><span class="seg" id="bProfile"><button data-v="follow" data-ic="follow">Follow ground</button><button data-v="grade" data-ic="grade">Even grade</button></span><button id="bBridges" class="tog" data-ic="bridge">Bridges</button><button id="bBridgeType">Stone arch</button><button id="bTunnels" class="tog" data-ic="tunnel">Tunnels</button></div>
  <div class="tools" id="bIdle"><button id="btnUndo" data-ic="undo">Undo</button><button id="btnRemove" data-ic="eraser">Remove track</button><button id="btnClearAll" data-ic="trash">Clear all</button><button id="btnDone" data-ic="done">Done</button></div>
  <div class="tools" id="bPending" hidden><button id="btnDiscard" data-ic="close">Discard plan</button><button id="btnStRotL" hidden>⟲</button><button id="btnStRotR" hidden>⟳</button><button id="btnStFlip" hidden>⇅ Other side</button><button id="btnStOK" class="go big keepcap" hidden>✓ Place station</button><button id="btnBuildOK" class="go big keepcap" data-ic="hammerCheck">Build it</button></div>
</div>
<div id="driveBar" hidden>
  <div id="trainList" hidden></div>
  <div class="dtop"><div class="speed"><span id="dSpeed">0</span><small>km/h</small></div><div id="driveInfo"></div></div>
  <div id="driveCtl">
  <div class="drow"><label>Regulator<input type="range" id="dThrottle" min="0" max="100" value="0"></label><label>Brake<input type="range" id="dBrake" min="0" max="100" value="0"></label></div>
  <div class="drow"><span class="seg"><button data-rev="-1" data-ic="reverse">Reverse</button><button data-rev="0" data-ic="neutral">Neutral</button><button data-rev="1" data-ic="forward">Forward</button></span><button id="dWhistle" class="whistle" data-ic="whistle">Whistle</button></div>
  <div class="drow"><button id="dCam" data-ic="camera">Camera</button><button id="dAuto" data-ic="auto">Autopilot</button><button id="dNext" data-ic="next">Next train</button><button id="dRerail" data-ic="rerail" hidden>Rerail</button></div></div>
  <div class="drow"><button id="dList" data-ic="list">Trains list</button><button id="dAdd" class="add" data-ic="loco">Add locomotive</button><button id="dRemove" data-ic="trash">Remove train</button><button id="dDone" class="go" data-ic="done">Done</button></div></div>
<div id="cine" hidden><button id="cineCam" class="keepcap" data-ic="camera">Camera</button><button id="cineExit" data-ic="close">Show the controls</button></div>
<section id="panel" aria-label="Settings">
  <header><h2>Settings</h2><button id="btnClose" data-ic="close">Close</button></header>
  <nav id="tabs"></nav>
  <div id="sections"></div>
</section>
<div id="stArrows"></div>
<div id="upNotes" aria-live="polite"></div>
<div id="banner" role="status" hidden><div class="bn-h"></div><div class="bn-b"></div><div class="bn-t"><button class="bn-show">Show me</button><button class="bn-ok go">OK</button></div></div>
<div id="busy" role="status" hidden><i class="spin"></i><span id="busyText">Updating…</span></div>
<div id="prog" role="status"><div id="progLabel">Starting</div><div class="bar"><i id="progBar"></i></div></div>
<div id="toast" role="status"></div>
<div id="err" hidden><div><h3>Trein could not start</h3><p id="errMsg"></p><p class="hint">Export the debug log and send it over so the cause can be fixed.</p><button id="errLog">Export debug log</button></div></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<!-- the game: classic scripts, loaded in this order; they share one global scope (a top-level const in one file is visible in the files after it).
     Code that runs while a file loads may only use what earlier files define. See trein-handoff.md for what is where. -->
<script src="js/core.js"></script>
<script src="js/gen.js"></script>
<script src="js/gl.js"></script>
<script src="js/shaders.js"></script>
<script src="buildings/kit.js"></script>
<script src="buildings/cottage.js"></script>
<script src="buildings/tavern.js"></script>
<script src="buildings/farmhouse.js"></script>
<script src="buildings/shop.js"></script>
<script src="buildings/church.js"></script>
<script src="buildings/bridge.js"></script>
<script src="buildings/station.js"></script>
<script src="buildings/sawmill.js"></script>
<script src="buildings/farm.js"></script>
<script src="js/objshaders.js"></script>
<script src="js/meshes.js"></script>
<script src="js/track.js"></script>
<script src="js/route.js"></script>
<script src="js/network.js"></script>
<script src="js/build.js"></script>
<script src="js/train.js"></script>
<script src="js/audio.js"></script>
<script src="js/drive.js"></script>
<script src="js/weather.js"></script>
<script src="js/life.js"></script>
<script src="js/music.js"></script>
<script src="js/render.js"></script>
<script src="js/camera.js"></script>
<script src="js/plane.js"></script>
<script src="js/roadveh.js"></script>
<script src="js/main.js"></script>
<script src="js/bench.js"></script>
<script>/* installable app: register the service worker when served over http(s) (GitHub Pages); a file:// or content:// page cannot */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('service worker',e)));</script>
</body></html>
