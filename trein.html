<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1e3b30">
<title>Trein</title>
<style>
:root{--green:#1e3b30;--green2:#2a5141;--brass:#c9a14a;--paper:#efe8d6;--coal:#15191a;--steel:#93a0a3;--red:#b8483a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0f10;overflow:hidden;overscroll-behavior:none}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--paper);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));pointer-events:none;text-shadow:0 1px 3px #000c}
#hud .title{font:italic 600 22px/1 Georgia,"Times New Roman",serif;letter-spacing:.01em}
#stats{font-size:11px;color:#efe8d6d9;margin-top:4px;font-variant-numeric:tabular-nums;white-space:pre-wrap;max-width:calc(100vw - 150px)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;pointer-events:none;transition:opacity .2s}
#bar.hide{opacity:0}#bar.hide button{pointer-events:none}
#bar button{pointer-events:auto;box-shadow:0 2px 10px #0007;padding:10px 9px;font-size:13.5px}
#buildBar button{pointer-events:auto}
#buildBar{pointer-events:none;position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#0b0f10cc 30%)}
#buildBar[hidden]{display:none}
#buildInfo{font-size:13px;margin:0 4px 8px;min-height:18px;text-shadow:0 1px 3px #000}
#buildBar .tools{display:flex;gap:6px}#buildBar .tools[hidden]{display:none}#buildBar .tools button{flex:1;padding:10px 4px;font-size:14px;min-height:46px}#buildBar .tools button.big{flex:2;font-size:16px}
#buildBar .chips[hidden],#buildBar [hidden]{display:none!important}
#buildBar .modes{display:flex;justify-content:center;margin-bottom:6px}#buildBar .modes .seg{flex:1}#buildBar .modes .seg button{flex:1;min-height:38px;font-size:14px}
#buildBar .seg.slope button{min-width:38px;font-size:15px}#buildBar .seg.slope button[data-slope=auto]{font-size:12.5px}
#ovl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#buildBar .seg.dir button{padding:4px 7px}#buildBar .seg button.ic,#buildBar .tog.ic{padding:5px 8px}#buildBar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
#buildBar .seg.len{align-items:center}#bLen{min-width:46px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
#buildBar button.on{background:var(--brass);color:var(--coal);border-color:var(--brass);font-weight:600}
#buildBar button:disabled{opacity:.45}
#btnSound.corner{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));min-height:34px;padding:6px 10px;font-size:12.5px;background:#1e3b30cc}
#driveBar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#0b0f10d9 26%)}
#driveBar[hidden],#driveBar [hidden]{display:none!important}
.ilabel{position:fixed;transform:translate(-50%,-100%);width:40px;height:40px;border-radius:50%;background:#e9c870;border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 8px #0008;pointer-events:auto;cursor:pointer;z-index:5;user-select:none}
.vlabel{position:fixed;overflow:visible;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;padding:4px 12px 5px;border-radius:12px;background:#15241ccc;border:1px solid #c9a14a99;color:#f6ead0;font:600 13px system-ui;text-shadow:0 1px 2px #000;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none;white-space:nowrap;z-index:5}.vlabel b{font:700 15px Georgia,serif;color:#f3d98a}.vlabel span{font-size:11px;opacity:.85}
#vPanel{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);width:min(92vw,420px);background:#15191af2;border:1px solid #c9a14a80;border-radius:16px;padding:12px 14px;color:#f1e7d0;font:500 14px system-ui;z-index:20;box-shadow:0 8px 24px #000a}#vPanel .vp-h{display:flex;justify-content:space-between;align-items:center}#vPanel .vp-h b{font:700 20px Georgia,serif;color:#f3d98a;margin-right:8px}#vPanel .vp-row{margin:6px 0}#vPanel .vp-bar{height:8px;border-radius:5px;background:#2b3a32;overflow:hidden;margin:4px 0 10px}#vPanel .vp-bar i{display:block;height:100%;background:linear-gradient(90deg,#7fc96b,#e9c870)}#vPanel .vp-tools{display:flex;gap:6px;flex-wrap:wrap}#vPanel .vp-farm{margin:8px 0;padding:8px 10px;border-radius:10px;background:#20302a;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}#vPanel .vp-farm.av{background:#3b3518;border:1px solid #e9c870}#vPanel .vp-farm.on{background:#1f3a24}
.vl-farm{position:absolute;right:-12px;top:-12px;font-style:normal;font-size:18px;background:#e9c870;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 #e9c870aa;animation:vlpulse 1.4s infinite}@keyframes vlpulse{0%{box-shadow:0 0 0 0 #e9c870aa}70%{box-shadow:0 0 0 12px #e9c87000}100%{box-shadow:0 0 0 0 #e9c87000}}
#vPanel .vp-note{margin-top:8px;font-size:12px;opacity:.7}
select.dsel{appearance:none;-webkit-appearance:none;background:#1d3a2e linear-gradient(45deg,transparent 50%,#e9c870 50%) no-repeat calc(100% - 15px) 55%/6px 6px,#1d3a2e linear-gradient(135deg,#e9c870 50%,transparent 50%) no-repeat calc(100% - 10px) 55%/6px 6px;color:#f6ead0;border:1px solid #c9a14a;border-radius:12px;padding:8px 30px 8px 12px;font:600 14px system-ui;min-width:9em;box-shadow:inset 0 1px 0 #ffffff14,0 2px 6px #0006;margin-left:6px}select.dsel:focus{outline:2px solid #e9c87088}select.dsel option{background:#16221c;color:#f6ead0}
#trainList{max-height:34vh;overflow-y:auto;margin-bottom:8px;background:#15191af0;border:1px solid #c9a14a40;border-radius:10px;padding:4px 8px}
.trow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #c9a14a22}.wed{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:4px 0 8px;border-bottom:1px solid #c9a14a22}.wed span{font-size:12px;color:var(--steel);margin-right:4px}.wed .wadd{min-height:36px;min-width:44px;padding:4px 8px;font-size:16px;line-height:1}.wed .wadd small{font-size:10px;margin-left:2px;color:var(--brass)}.trow.on b{color:var(--brass)}.trow div{flex:1;display:flex;flex-direction:column;font-size:13px}.trow span{color:var(--steel);font-size:12px}.trow button{min-height:36px;padding:5px 9px;font-size:12.5px}.trow button.on{background:var(--brass);color:var(--coal)}
#driveBar .dtop{display:flex;align-items:flex-end;gap:12px;margin:0 4px 6px}#driveBar .speed{font:600 38px/1 Georgia,serif;color:var(--brass);font-variant-numeric:tabular-nums;text-shadow:0 2px 6px #000}
#driveBar .speed small{font:13px system-ui,sans-serif;color:var(--paper);margin-left:4px}#driveInfo{font-size:13px;text-shadow:0 1px 3px #000;padding-bottom:4px}
#driveBar .drow{display:flex;gap:6px;margin-top:6px;align-items:center}#driveBar .drow>button{flex:1;padding:8px 4px;font-size:13.5px}
#driveBar label{flex:1;font-size:12.5px;display:flex;flex-direction:column;gap:2px}#driveBar input[type=range]{width:100%;accent-color:var(--brass);height:30px}
#driveBar .seg{display:flex;border:1px solid #c9a14a59;border-radius:9px;overflow:hidden;flex:2}#driveBar .seg button{flex:1;border:0;border-radius:0;min-height:40px;padding:6px 4px;font-size:13px}
#driveBar button.on{background:var(--brass);color:var(--coal);font-weight:600}#driveBar .whistle.on{background:#efe8d6;color:var(--coal)}#driveBar button.go{background:var(--brass);color:var(--coal);font-weight:600}
#buildBar .chips{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}#buildBar .seg{display:flex;border:1px solid #c9a14a59;border-radius:9px;overflow:hidden}
#buildBar .seg button,#buildBar .tog{min-height:34px;padding:5px 9px;font-size:12.5px;border-radius:0;border:0;background:#1e3b30e6}#buildBar .tog{border:1px solid #c9a14a59;border-radius:9px}
#buildBar .seg button+button{border-left:1px solid #c9a14a40}#buildBar button.go{background:var(--brass);color:var(--coal);font-weight:600}
#buildBar button.on{background:var(--brass);color:var(--coal);border-color:var(--brass);font-weight:600}
button{font:inherit;color:var(--paper);background:var(--green);border:1px solid #c9a14a59;border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button:active{background:var(--green2)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#btnGen.attn{background:var(--brass);color:var(--coal);border-color:var(--brass);font-weight:600}
#panel{position:fixed;left:0;right:0;bottom:0;height:min(64vh,560px);background:#1e3b30f5;border-radius:16px 16px 0 0;transform:translateY(102%);transition:transform .24s ease;display:flex;flex-direction:column;box-shadow:0 -8px 30px #0009;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #c9a14a40}
#panel.open{transform:none}
#panel header{display:flex;align-items:center;gap:10px;padding:10px 12px 4px 16px}
#panel header h2{margin:0;font:italic 600 18px/1 Georgia,serif;flex:1}
#panel header button{min-height:38px;padding:6px 12px}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 10px 8px;scrollbar-width:none;border-bottom:1px solid #c9a14a33;flex:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{min-height:34px;padding:6px 11px;font-size:13px;white-space:nowrap;background:transparent;border-color:transparent;border-radius:8px}
#tabs button.on{background:var(--coal);border-color:#c9a14a66;color:var(--brass)}
#sections{overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1}
.row{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:10px;padding:8px 0 0}
.row label{color:var(--paper)}
.row .val{color:var(--brass);font-variant-numeric:tabular-nums;font-size:13px}
.row input[type=range]{grid-column:1/3;width:100%;margin:4px 0 2px;accent-color:var(--brass);height:28px;touch-action:pan-y}
.row.sel{grid-template-columns:1fr minmax(120px,48%);align-items:center}.row.sel .val{display:none}
.row.chk{grid-template-columns:1fr auto auto;align-items:center}
.row select{font:inherit;color:var(--paper);background:var(--coal);border:1px solid #c9a14a59;border-radius:8px;padding:8px;min-height:40px;width:100%}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--brass);margin:0}
.hint{color:var(--steel);font-size:12.5px;margin:8px 0 4px;max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.actions button{min-height:40px;padding:8px 12px;font-size:13px}
#prog{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:#1e3b30f2;padding:16px 18px 14px;border-radius:12px;width:min(300px,80vw);display:none;box-shadow:0 6px 24px #000a;border:1px solid #c9a14a40}
#progLabel{font-size:13.5px}
#prog .bar{height:6px;background:#0006;border-radius:3px;margin-top:10px;overflow:hidden}
#progBar{display:block;height:100%;background:var(--brass);width:0;transition:width .15s}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--coal);border:1px solid #c9a14a59;color:var(--paper);padding:9px 14px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:13.5px;max-width:86vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f10e8;padding:24px}
#err[hidden]{display:none}
#err div{max-width:420px;background:var(--green);border:1px solid var(--red);border-radius:12px;padding:18px}
#err h3{margin:0 0 8px;font:600 17px Georgia,serif}
@media (prefers-reduced-motion:reduce){#panel,#toast,#bar{transition:none}}
/* pictogram buttons: icon on top, caption below (captions only with Settings > File > Words under button icons, or on .keepcap buttons) */
button.ic{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.05;--btnbg:var(--green)}
button.ic svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
button.ic .cap{font-size:10.5px;font-weight:500}button.ic .v{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
body:not(.caps) button.ic:not(.keepcap) .cap{display:none}
button.ic.on,button.ic.go,#btnGen.attn{--btnbg:var(--brass)}
button.ic.add{position:relative}button.ic.add::after{content:'+';position:absolute;top:2px;right:5px;font:800 15px/1 system-ui;color:var(--brass)}button.ic.add.on::after,button.ic.add.go::after{color:var(--coal)}
#bar button.ic{min-width:54px;padding:8px 10px}#btnSound.corner.ic{padding:5px 9px}#btnSound.corner.ic svg.i{width:20px;height:20px}
#skySheet .row2 button.ic{min-width:38px;padding:6px 4px}#skySheet .row2 button.ic svg.i{width:21px;height:21px}
#btnGen.attn::after{content:'';position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--coal)}#btnGen{position:relative}
#btnSky.corner{position:fixed;right:calc(92px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));min-height:34px;padding:6px 10px;font-size:12.5px;background:#1e3b30cc;font-variant-numeric:tabular-nums}
#clock{font-size:12.5px;margin-top:3px;color:#efe8d6;font-variant-numeric:tabular-nums}
#skySheet{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(52px + env(safe-area-inset-top));width:min(340px,calc(100vw - 20px));background:#15191af2;border:1px solid #c9a14a55;border-radius:14px;padding:12px;z-index:5;box-shadow:0 6px 24px #000a}
#skySheet[hidden]{display:none}
#skySheet h4{margin:10px 0 6px;font:600 12.5px/1.2 system-ui,sans-serif;color:#c9a14a}#skySheet h4:first-child{margin-top:0}
#skySheet .row2{display:flex;flex-wrap:wrap;gap:6px}#skySheet .row2 button{flex:1 1 auto;min-height:36px;padding:6px 8px;font-size:13px}
#skySheet button.on{background:var(--brass);color:var(--coal);border-color:var(--brass);font-weight:600}
#skySheet input[type=range]{width:100%}
#skySheet .foot{display:flex;gap:6px;margin-top:10px}#skySheet .foot button{flex:1;min-height:38px}
#skySheet .row2 button.ic{flex:1 1 0;min-width:0;padding:6px 2px}
/* bars, sheets and panels sit above the village and industry labels (labels used to cover the sky sheet and could take taps meant for the build bar) */
#hud,#bar,#buildBar,#driveBar{z-index:10}#btnSound,#btnSky{z-index:11}#skySheet{z-index:12}#vPanel{z-index:20}#panel{z-index:30}#prog,#toast{z-index:40}#err{z-index:50}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><div class="title">Trein</div><div id="clock"></div><div id="stats"></div></div>
<div id="bar"><button id="btnMenu" data-ic="gear">Settings</button><button id="btnBuild" data-ic="build">Build</button><button id="btnDrive" data-ic="trains">Trains</button><button id="btnGen" data-ic="generate">Generate</button><button id="btnSave" data-ic="save">Save</button></div>
<button id="btnSound" class="corner" data-ic="soundOff">Sound off</button><button id="btnSky" class="corner" aria-label="Time, season and weather">10:30</button>
<div id="skySheet" hidden>
  <h4>Time of day</h4><input type="range" id="skyTime" min="0" max="24" step="0.05">
  <div class="row2"><button data-speed="0" data-ic="pause">Paused</button><button data-speed="30" data-ic="play">Slow</button><button data-speed="120" data-ic="fast">Fast</button><button data-speed="400" data-ic="faster">Very fast</button></div>
  <h4>Season</h4><div class="row2"><button data-season="spring" data-ic="spring">Spring</button><button data-season="summer" data-ic="summer">Summer</button><button data-season="autumn" data-ic="autumn">Autumn</button><button data-season="winter" data-ic="winter">Winter</button></div>
  <h4>Weather</h4><div class="row2"><button data-wx="auto" data-ic="wxAuto">By itself</button><button data-wx="clear" data-ic="clear">Clear</button><button data-wx="fair" data-ic="fair">Fair</button><button data-wx="cloudy" data-ic="cloudy">Cloudy</button><button data-wx="mist" data-ic="mist">Mist</button><button data-wx="rain" data-ic="rain">Rain</button><button data-wx="storm" data-ic="storm">Storm</button><button data-wx="snow" data-ic="snow">Snow</button></div>
  <div class="foot"><button id="skyMusic" data-ic="music">Music on</button><button id="skyClose" data-ic="close">Close</button></div>
</div>
<canvas id="ovl"></canvas>
<div id="buildBar" hidden>
  <div class="modes"><span class="seg"><button data-mode="pieces" data-ic="pieces">Pieces</button><button data-mode="draw" data-ic="draw">Draw</button><button data-mode="route" data-ic="route">Route</button><button data-mode="signals" data-ic="signals">Signals</button><button data-mode="roads" data-ic="roads">Roads</button></span></div>
  <div id="buildInfo"></div>
  <div id="mPieces">
    <div class="chips"><span class="seg dir">
      <button data-dir="-2" title="Sharp left"><svg viewBox="0 0 24 24"><path d="M12 21V12a5 5 0 0 0-5-5H4M7 3 3 7l4 4"/></svg></button>
      <button data-dir="-1" title="Gentle left"><svg viewBox="0 0 24 24"><path d="M14 21c0-8-3-12-8-14M6 3 4 7.5 8.5 9"/></svg></button>
      <button data-dir="0" title="Straight"><svg viewBox="0 0 24 24"><path d="M12 21V4M7 9l5-5 5 5"/></svg></button>
      <button data-dir="1" title="Gentle right"><svg viewBox="0 0 24 24"><path d="M10 21c0-8 3-12 8-14M18 3l2 4.5L15.5 9"/></svg></button>
      <button data-dir="2" title="Sharp right"><svg viewBox="0 0 24 24"><path d="M12 21V12a5 5 0 0 1 5-5h3M17 3l4 4-4 4"/></svg></button></span>
      <span class="seg len"><button id="pLenMinus">−</button><span id="pLen">20 m</span><button id="pLenPlus">+</button></span>
      <span class="seg" id="pRot"><button id="pRotL" title="Turn start left">⟲</button><button id="pRotR" title="Turn start right">⟳</button></span></div>
    <div class="chips"><span class="seg slope"><button data-slope="down2" title="Steep down">⇊</button><button data-slope="down" title="Down">↘</button><button data-slope="level" title="Level">→</button><button data-slope="auto" data-ic="follow">Follow the ground</button><button data-slope="up" title="Up">↗</button><button data-slope="up2" title="Steep up">⇈</button></span></div>
    <div class="tools"><button id="pNew" data-ic="newLine">New line</button><button id="pBranch" data-ic="junction">Junction</button><button id="pDemolish" data-ic="demolish">Demolish</button><button id="pPlace" class="go big keepcap" data-ic="place">Place</button></div>
  </div>
  <div id="mRoads" hidden><div class="chips"><span class="seg"><button data-rtool="route" data-ic="roadBend">Road (follow land)</button><button data-rtool="straight" data-ic="straight">Straight</button><button data-rtool="stop" data-ic="busStop">Bus stop</button><button data-rtool="remove" data-ic="eraser">Remove road or stop</button></span></div><div class="tools"><button id="rStart" data-ic="restart">Start the road over</button><button id="rAddBus" class="go add" data-ic="bus">Add bus</button><button id="rAddLorry" class="add" data-ic="lorry">Add lorry</button></div></div>
  <div id="mSignals" hidden><div class="chips"><span class="seg"><button data-sig="signal" data-ic="signals">Signal</button><button data-sig="station" data-ic="station">Station</button><button data-sig="remove" data-ic="eraser">Remove signal or station</button></span></div></div>
  <div class="tools" id="bChoice" hidden><button id="cA" class="go">A</button><button id="cB">B</button><button id="cC">C</button></div>
  <div id="mRoute" hidden><div class="chips"><span class="seg"><button data-prefer="scenic" data-ic="roadBend">Scenic (hug the land)</button><button data-prefer="direct" data-ic="direct">Direct</button></span><button id="rClear" class="tog" data-ic="restart">Start the route over</button></div></div>
  <div class="chips"><span class="seg" id="bProfile"><button data-v="follow" data-ic="follow">Follow ground</button><button data-v="grade" data-ic="grade">Even grade</button></span><button id="bBridges" class="tog" data-ic="bridge">Bridges</button><button id="bBridgeType">Stone arch</button><button id="bTunnels" class="tog" data-ic="tunnel">Tunnels</button></div>
  <div class="tools" id="bIdle"><button id="btnUndo" data-ic="undo">Undo</button><button id="btnRemove" data-ic="eraser">Remove track</button><button id="btnClearAll" data-ic="trash">Clear all</button><button id="btnDone" data-ic="done">Done</button></div>
  <div class="tools" id="bPending" hidden><button id="btnDiscard" data-ic="close">Discard plan</button><button id="btnBuildOK" class="go big keepcap" data-ic="hammerCheck">Build it</button></div>
</div>
<div id="driveBar" hidden>

const Pending={world:false,water:false,veg:false,tex:false,shadow:false,trees:false,track:false,life:false,smooth:false};
let pendTimer=0;
function paramChanged(id,fromPreset){
  const d=PDEF[id];if(!d)return;
  if(d.q&&!fromPreset&&P.preset!=='custom'){P.preset='custom';UI.refresh('preset');}
  if(id==='btnCaps')UI.caps();
  switch(d.apply){
    case 'world':Pending.world=true;UI.markGenerate(true);break;
    case 'water':case 'veg':case 'tex':case 'shadow':case 'trees':case 'track':case 'life':case 'smooth':Pending[d.apply]=true;clearTimeout(pendTimer);pendTimer=setTimeout(()=>App.applyPending(),450);break;
    case 'preset':applyPreset(P.preset);break;
  }
}

function svgIcon(n){return'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';}
// names from a save file go into HTML: escape them (an imported save could otherwise inject markup)
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function iconize(root){for(const b of (root||document).querySelectorAll('button[data-ic]:not(.ic)')){const t=b.textContent.trim();b.classList.add('ic');b.innerHTML=svgIcon(b.dataset.ic)+'<span class="cap"></span><span class="v" hidden></span>';setCap(b,t);}}
// label = what the button does (caption, tooltip, screen readers); val = a live value shown under the icon even without captions
function setCap(b,label,val){if(!b)return;if(!b.classList.contains('ic')){b.textContent=label+(val?' '+val:'');return;}b.querySelector('.cap').textContent=label;const v=b.querySelector('.v');v.textContent=val||'';v.hidden=!val;b.title=label+(val?': '+val:'');b.setAttribute('aria-label',b.title);}
// touch screens show no tooltips: a long press on an icon button names it in a toast and does not trigger it (the whistle is held on purpose)
const IconHint={t:0,b:null,shown:false,bind(){
  document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button.ic');if(!b||b.id==='dWhistle')return;clearTimeout(this.t);this.b=b;this.shown=false;
    this.t=setTimeout(()=>{if(this.b!==b)return;this.shown=true;UI.toast(b.getAttribute('aria-label')||b.title||'');if(navigator.vibrate)navigator.vibrate(10);},480);},true);
  for(const ev of ['pointerup','pointercancel'])document.addEventListener(ev,()=>{clearTimeout(this.t);this.b=null;},true);
  document.addEventListener('click',e=>{if(this.shown&&e.target.closest&&e.target.closest('button.ic')){this.shown=false;e.preventDefault();e.stopImmediatePropagation();}},true);
  document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('button.ic'))e.preventDefault();});}};
function setIcon(b,n){if(!b||!b.classList.contains('ic')||b.dataset.ic===n)return;b.dataset.ic=n;const s=b.querySelector('svg.i');if(s)s.outerHTML=svgIcon(n);}

  function fmt(d,v){if(d.kind==='select'){const o=d.options.find(o=>String(o[0])===String(v));return o?o[1]:v;}if(d.kind==='check')return v?'On':'Off';
    const st=d.step||0.01,dec=st>=1?0:st>=0.1?1:st>=0.01?2:3;return Number(v).toFixed(dec)+(d.unit||'');}
  function build(){
    iconize();IconHint.bind();const tabs=$('#tabs'),secs=$('#sections');
    for(const [id,label] of TABS){const b=document.createElement('button');b.textContent=label;b.dataset.tab=id;b.onclick=()=>show(id);tabs.appendChild(b);
      const s=document.createElement('div');s.className='sec';s.dataset.tab=id;s.hidden=true;
      if(TAB_HINT[id]){const h=document.createElement('p');h.className='hint';h.textContent=TAB_HINT[id];s.appendChild(h);}
      secs.appendChild(s);}
    for(const id of PORDER){const d=PDEF[id],sec=secs.querySelector(`.sec[data-tab="${d.tab}"]`);
      const r=document.createElement('div');r.className='row';const lab=document.createElement('label');lab.textContent=d.label;lab.htmlFor='p_'+id;
      const val=document.createElement('span');val.className='val';r.append(lab,val);let inp;
      if(d.kind==='range'){inp=document.createElement('input');inp.type='range';inp.min=d.min;inp.max=d.max;inp.step=d.step;
        inp.oninput=()=>{P[id]=parseFloat(inp.value);val.textContent=fmt(d,P[id]);paramChanged(id);};}
      else if(d.kind==='select'){inp=document.createElement('select');for(const [v,l] of d.options){const o=document.createElement('option');o.value=v;o.textContent=l;inp.appendChild(o);}
        inp.onchange=()=>{const v=inp.value;P[id]=isNaN(+v)?v:+v;val.textContent='';paramChanged(id);};r.classList.add('sel');}
      else{inp=document.createElement('input');inp.type='checkbox';inp.onchange=()=>{P[id]=inp.checked?1:0;val.textContent=fmt(d,P[id]);paramChanged(id);};r.classList.add('chk');}
      inp.id='p_'+id;r.appendChild(inp);sec.appendChild(r);rows[id]={inp,val,d};}
    // extra actions
    const w=secs.querySelector('.sec[data-tab="world"]');w.insertBefore(actions([['New random seed',()=>{P.seed=1+Math.floor(Math.random()*99998);refresh('seed');paramChanged('seed');App.generate(0);}],['Reset world sliders',()=>resetTab('world')]]),w.children[1]);
    const f=secs.querySelector('.sec[data-tab="file"]');
    f.insertBefore(actions([['Save',()=>App.save()],['Load save',()=>App.load()],['Export JSON',()=>App.exportJSON()],['Import JSON',()=>$('#file').click()],['Export debug log',()=>App.exportLog()],['Export touch log',()=>TouchLog.export()],['Reset everything',()=>App.resetAll()]]),f.firstChild);
    const info=document.createElement('p');info.className='hint';info.id='worldinfo';f.appendChild(info);
    $('#file').onchange=e=>{const fl=e.target.files[0];if(fl)App.importJSON(fl);e.target.value='';};
    refreshAll();show('world');
  }
  function actions(list){const d=document.createElement('div');d.className='actions';for(const [t,fn] of list){const b=document.createElement('button');b.textContent=t;b.onclick=fn;d.appendChild(b);}return d;}
  function resetTab(tab){for(const id of PORDER)if(PDEF[id].tab===tab){P[id]=PDEF[id].def;refresh(id);paramChanged(id);}}
  function show(tab){curTab=tab;for(const b of document.querySelectorAll('#tabs button'))b.classList.toggle('on',b.dataset.tab===tab);
    for(const s of document.querySelectorAll('.sec'))s.hidden=s.dataset.tab!==tab;$('#sections').scrollTop=0;}
  function refresh(id){const r=rows[id];if(!r)return;const v=P[id];if(r.d.kind==='check')r.inp.checked=!!v;else r.inp.value=v;r.val.textContent=r.d.kind==='select'?'':fmt(r.d,v);}
  function refreshAll(){for(const id in rows)refresh(id);caps();}
  function caps(){document.body.classList.toggle('caps',!!P.btnCaps);}
  function markGenerate(on){const b=$('#btnGen');b.classList.toggle('attn',on);setCap(b,on?'Generate (settings changed)':'Generate');}
  let toastT=0;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}
  function progress(on,frac,label){const p=$('#prog');p.style.display=on?'block':'none';if(on){$('#progLabel').textContent=label||'';$('#progBar').style.width=Math.round(frac*100)+'%';}}
  return{build,refresh,refreshAll,markGenerate,toast,progress,show,caps};
})();

// MONEY (optional, OpenTTD-like): start with €200k, building costs, a loan up to €500k with interest,
// fares = distance × passengers × speed factor, paid when passengers get off

const Money={cash:200000,loan:0,inited:false,paid:new Map(),paidSt:new Set(),paidTr:new Set(),maxLoan:500000,flo:[],year:{inc:0,exp:0},
  on(){return !!P.money;},fmt(v){return Math.round(v).toLocaleString('nl-NL');},
  init(){if(this.inited)return;this.inited=true;for(const q of Track.segs)if(!q.pend&&!this.paid.has(q.id))this.paid.set(q.id,0);for(const q of Track.stations)this.paidSt.add(q.id);for(const t of Trains.list)this.paidTr.add(t.id);this.hud();},
  segCost(q){let c=q.L*110;for(const sp of q.spans||[]){const L=sp[1]-sp[0];c+=sp[2]==='t'?L*1400:L*[900,850,1150,950,1000,520][sp[3]|0];}return c;},
  paidSeg(a,b,old){const c=old&&this.paid.has(old.id)?this.paid.get(old.id):0,tot=(a.L+b.L)||1;this.paid.set(a.id,c*a.L/tot);this.paid.set(b.id,c*b.L/tot);if(old)this.paid.delete(old.id);},
  canBuild(){return !this.on()||this.cash>0||this.loan<this.maxLoan;},
  spend(c,why){if(c<=0)return;this.cash-=c;this.year.exp+=c;if(this.cash<0&&this.loan<this.maxLoan){const b=Math.min(this.maxLoan-this.loan,Math.ceil(-this.cash/50000)*50000);this.loan+=b;this.cash+=b;UI.toast(`Borrowed €${this.fmt(b)} to pay for ${why}`);}
    this.note(-c,why);this.hud();},
  earn(c,where,x,y,z){this.cash+=c;this.year.inc+=c;this.note(c,where,x,y,z);this.hud();},
  // OpenTTD-ish: €/passenger-km, full pay up to an expected trip time (65 km/h + stops), less when slow
  fare(p,si){if(p.fx==null)return 0;const d=Math.abs(si.x-p.fx)+Math.abs(si.z-p.fz),T=App.time-(p.t0||App.time),exp=d/15+75,f=clamp(1.6-0.6*T/exp,0.25,1.3);return 350*P.fareRate*(d/1000)*f;},
  check(){if(!this.on()){this.hud();return;}this.init();let cost=0,refund=0;const live=new Set();
    for(const q of Track.segs){if(q.pend)continue;live.add(q.id);if(!this.paid.has(q.id)){const c=this.segCost(q);this.paid.set(q.id,c);cost+=c;}}
    for(const [id,c] of this.paid)if(!live.has(id)){refund+=c*0.5;this.paid.delete(id);}
    for(const st of Track.stations)if(!this.paidSt.has(st.id)){this.paidSt.add(st.id);cost+=25000;}
    for(const t of Trains.list)if(!this.paidTr.has(t.id)){this.paidTr.add(t.id);cost+=40000+t.veh.length*15000;}
    if(cost>refund)this.spend(Math.round(cost-refund),'building');else if(refund>cost){this.cash+=refund-cost;this.note(refund-cost,'demolition refund');this.hud();}},
  newDay(){if(!this.on()||!this.loan)return;const i=this.loan*0.05/(4*Math.max(1,P.daysPerSeason));this.cash-=i;this.year.exp+=i;this.hud();},
  borrow(){if(this.loan>=this.maxLoan){UI.toast('The bank will not lend more');return;}const b=Math.min(50000,this.maxLoan-this.loan);this.loan+=b;this.cash+=b;this.hud();},
  repay(){const r=Math.min(50000,this.loan,Math.max(0,this.cash));if(r<=0){UI.toast(this.loan?'Not enough cash to repay':'No loan');return;}this.loan-=r;this.cash-=r;this.hud();},
  note(v,txt,x,y,z){this.flo.push({v,txt,x,y,z,t:0});if(this.flo.length>6){const o=this.flo.shift();if(o.el)o.el.remove();}},
  hud(){let el=document.getElementById('money');if(!el){el=document.createElement('div');el.id='money';el.style.cssText='margin-top:4px;font:600 14px system-ui;color:#fff;text-shadow:0 1px 2px #000;pointer-events:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap';
      const hud=document.getElementById('hud');if(!hud)return;hud.appendChild(el);el.innerHTML='<span id="mCash"></span><button id="mBor" style="font-size:12px;padding:2px 8px">Borrow</button><button id="mRep" style="font-size:12px;padding:2px 8px">Repay</button><div id="mLog" style="width:100%;font-weight:500;font-size:12px"></div>';
      el.querySelector('#mBor').onclick=()=>this.borrow();el.querySelector('#mRep').onclick=()=>this.repay();}
    el.hidden=!this.on();if(!this.on())return;const c=el.querySelector('#mCash');c.textContent=`€ ${this.fmt(this.cash)}`+(this.loan?`  ·  loan € ${this.fmt(this.loan)}`:'');c.style.color=this.cash<0?'#ff9a8a':'#fff';},
  tick(dt){if(!this.on())return;this.acc=(this.acc||0)+dt;if(this.acc>1){this.acc=0;this.check();}
    const lg=document.getElementById('mLog');if(lg){this.flo.forEach(f=>{f.t+=dt;if(f.t>=6&&f.el)f.el.remove();});this.flo=this.flo.filter(f=>f.t<6);const h=this.flo.map(f=>`<div style="color:${f.v>=0?'#bff5b0':'#ffb3a6'}">${f.v>=0?'+':'−'}€ ${this.fmt(Math.abs(f.v))} ${f.txt}</div>`).join('');if(h!==this.logH){this.logH=h;lg.innerHTML=h;}}

      const p=Cam.toScreen(f.x,f.y+8+f.t*3,f.z);if(p){d.style.left=p[0]+'px';d.style.top=p[1]+'px';d.style.opacity=String(clamp(1.5-f.t/4,0,1));}else d.style.opacity='0';}}
};
// screen-space pick of a train: nearest vehicle centre to the tap, projected
function pickTrain(sx,sy){let best=-1,bd=Math.max(34,Math.min(80,6000/Math.max(Cam.dist||100,1)));Trains.list.forEach((t,i)=>{if(!t.poses)return;for(const p of t.poses){if(!p)continue;const q=Cam.toScreen(p.c[0],p.c[1]+2,p.c[2]);if(!q)continue;const d=Math.hypot(q[0]-sx,q[1]-sy);if(d<bd){bd=d;best=i;}}});return best;}

// GOODS: grain and produce from farming villages' farms, mail from every village, wood from sawmills. Loading points
// (train stations, bus stops) collect what is produced within reach; goods trains and lorries carry it to places that
// accept it (grain: villages with a bakery, produce: with a market, mail and wood: any village). Pay = units × km × rate.
// ===================================================================
const Goods={T:{grain:{icon:'🌾',rate:60},produce:{icon:'🥕',rate:80},mail:{icon:'✉️',rate:120},wood:{icon:'🪵',rate:50}},stock:new Map(),acc:0,
  get(k){let s=this.stock.get(k);if(!s){s={grain:0,produce:0,mail:0,wood:0};this.stock.set(k,s);}return s;},
  accepts(v,t){if(!v)return false;const lv=v.level|0;return t==='mail'||((t==='grain'||t==='produce')&&lv>=1);},
  woodSink(k,x,z){const id=+k.slice(3);if(k[0]==='s'){const st=Track.stations.find(q=>q.id===id);if(st&&st.workshop)return true;}else{const bs=Buses.stops.find(q=>q.id===id);if(bs&&bs.workshop)return true;}return (Life.workshops||[]).some(m=>Math.hypot(m.x-x,m.z-z)<250);},
  src(x,z){const r={grain:0,produce:0,mail:0,wood:0};for(const v of Life.villages||[]){if(v.farmOwned){const f=v.farm||v;if(Math.hypot(f.x-x,f.z-z)<650){r.grain+=0.05;r.produce+=0.035;}}if(Math.hypot(v.x-x,v.z-z)<500)r.mail+=0.02*((v.level|0)+1);}
    for(const m of Life.sawmills||[])if(Math.hypot(m.x-x,m.z-z)<650)r.wood+=0.06;return r;},
  tick(dt){this.acc+=dt;if(this.acc<1)return;const a=this.acc*P.goodsRate;this.acc=0;const pts=[];for(const si of Life.stInfo||[])pts.push(['st:'+si.st.id,si.x,si.z,si.st.sawmill]);for(const s of Buses.stops)pts.push(['bs:'+s.id,s.x,s.z,s.sawmill]);
    for(const [k,x,z,sm] of pts){const S=this.get(k),r=this.src(x,z);if(sm)r.wood+=0.18;for(const t in r)S[t]=Math.min(60,S[t]+r[t]*a);}},
  deliver(k,x,z,v,hold,where,label){let pay=0,units=0;const parts=[];for(const t in hold){const c=hold[t];if(!c||c.n<1||c.from===k||!(t==='wood'?this.woodSink(k,x,z):this.accepts(v,t)))continue;const km=(Math.abs(x-c.fx)+Math.abs(z-c.fz))/1000;pay+=c.n*km*this.T[t].rate*P.fareRate;units+=c.n;parts.push(`${Math.floor(c.n)} ${this.T[t].icon}`);c.n=0;}

  load(k,x,z,hold,caps){const S=this.get(k),parts=[];for(const t in caps){const c=hold[t]||(hold[t]={n:0,fx:x,fz:z,from:k});const take=Math.min(caps[t]-c.n,Math.floor(S[t]));if(take<1)continue;if(c.n<1){c.fx=x;c.fz=z;c.from=k;}c.n+=take;S[t]-=take;parts.push(`${take} ${this.T[t].icon}`);}
    if(parts.length)Icons.add(x,R.sampleHr(R.world,x,z)+5,z,'+'+parts.join(' '));},
  trainStop(tr,si){const k='st:'+si.st.id,crane=!!(si.st.sawmill||si.st.workshop),hold={},caps={};for(const w of tr.veh)if(w.k==='wagon'&&!(crane&&w.ctype==='wood')){hold[w.ctype]=hold[w.ctype]||{n:0,fx:si.x,fz:si.z,from:null};}

  lorryStop(b,s){const k='bs:'+s.id;b.cargo=b.cargo||{};this.deliver(k,s.x,s.z,s.v,b.cargo,s.name,b.name);const used=Object.values(b.cargo).reduce((a,c)=>a+(c.n||0),0),free=Math.max(0,16-used),caps={};

  nearestRoad(x,z,maxd){let best=null,bd=maxd;for(const r of Life.roads||[]){if(r.disc)continue;const p=r.p;for(let i=0;i+3<p.length;i+=2){const ax=p[i],az=p[i+1],ex=p[i+2]-ax,ez=p[i+3]-az,ll=ex*ex+ez*ez;if(ll<1e-6)continue;const t=clamp(((x-ax)*ex+(z-az)*ez)/ll,0,1),qx=ax+ex*t,qz=az+ez*t,d=Math.hypot(x-qx,z-qz);

    let p=[h[0],h[2]];const snap=this.nearestRoad(p[0],p[1],6);if(snap)p=[snap.x,snap.z];if(!this.a){this.a=p;Build.info(this.hint());return;}

// ---- binary min-heap for priority flood
class MinHeap{
  constructor(cap){this.i=new Int32Array(cap);this.k=new Float64Array(cap);this.n=0;}
  push(id,key){let a=this.n++;const I=this.i,K=this.k;while(a>0){const p=(a-1)>>1;if(K[p]<=key)break;I[a]=I[p];K[a]=K[p];a=p;}I[a]=id;K[a]=key;}
  pop(){const I=this.i,K=this.k,top=I[0];const n=--this.n;if(n>0){const id=I[n],key=K[n];let a=0;for(;;){let c=2*a+1;if(c>=n)break;if(c+1<n&&K[c+1]<K[c])c++;if(K[c]>=key)break;I[a]=I[c];K[a]=K[c];a=c;}I[a]=id;K[a]=key;}return top;}
}
const D8X=[1,-1,0,0,1,1,-1,-1],D8Y=[0,0,1,-1,1,-1,1,-1],D8D=[1,1,1,1,Math.SQRT2,Math.SQRT2,Math.SQRT2,Math.SQRT2];

function priorityFlood(H,N,eps){
  const F=new Float32Array(H),closed=new Uint8Array(N*N),hp=new MinHeap(N*N),order=new Int32Array(N*N);let oc=0;
  for(let i=0;i<N;i++){for(const c of [i,(N-1)*N+i,i*N,i*N+N-1]){if(!closed[c]){closed[c]=1;hp.push(c,F[c]);}}}
  while(hp.n){
    const c=hp.pop();order[oc++]=c;const cx=c%N,cy=(c/N)|0,fc=F[c];
    for(let k=0;k<8;k++){const x=cx+D8X[k],yy=cy+D8Y[k];if(x<0||yy<0||x>=N||yy>=N)continue;const n=yy*N+x;if(closed[n])continue;closed[n]=1;
      if(F[n]<=fc+eps)F[n]=Math.fround(fc+eps)>fc?Math.fround(fc+eps):fc+eps*4;hp.push(n,F[n]);}
  }

// ---- Lakes, rivers, waterfalls (step 6/7). Works on a copy of the eroded map and carves river beds.

  const depr=(F0)=>{const comp=new Int32Array(NN).fill(-1),list=[],stack=new Int32Array(NN);
    for(let s0=0;s0<NN;s0++){if(comp[s0]>=0||F0[s0]-H[s0]<=0.02)continue;const id=list.length,lev=F0[s0];let sp=0,area=0,minH=1e9,minC=s0;stack[sp++]=s0;comp[s0]=id;
      while(sp){const c=stack[--sp];area++;if(H[c]<minH){minH=H[c];minC=c;}const cx=c%N,cy=(c/N)|0;

    for(let k=0;k<8;k++){const x=i+D8X[k],yy=j+D8Y[k];if(x<0||yy<0||x>=N||yy>=N)continue;const m=(yy*N+x)*4;if(water[m+3]>0){sv+=water[m];c++;}}

    for(let j=1;j<N-1;j++)for(let i=1;i<N-1;i++){const n=j*N+i;if(water[n*4+3]===0||lakeId[n]>=0){fl[n*2]=water[n*4+1];fl[n*2+1]=water[n*4+2];continue;}
      let sx=0,sz=0,cnt=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const m=n+dy*N+dx;if(water[m*4+3]>0&&lakeId[m]<0){sx+=water[m*4+1];sz+=water[m*4+2];cnt++;}}

// ---- normals + data maps for the GPU (RGBA8)
function computeNormals(T,nrm){const {N,cs,H}=T;nrm=nrm||new Uint8Array(N*N*4);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const n=j*N+i,l=H[j*N+Math.max(i-1,0)],r=H[j*N+Math.min(i+1,N-1)],d=H[Math.max(j-1,0)*N+i],u=H[Math.min(j+1,N-1)*N+i];
    let nx=(l-r)/(2*cs),nz=(d-u)/(2*cs),ny=1;const L=Math.hypot(nx,ny,nz);nx/=L;ny/=L;nz/=L;
    nrm[n*4]=Math.round((nx*0.5+0.5)*255);nrm[n*4+1]=Math.round((ny*0.5+0.5)*255);nrm[n*4+2]=Math.round((nz*0.5+0.5)*255);nrm[n*4+3]=T.hole&&T.hole[n]?0:255;// A = 0 where a tunnel portal opens the ground
  }
  return nrm;}
function genMaps(p,T){
  const {N,cs,H}=T,NN=N*N;
  const nrm=computeNormals(T),data=new Uint8Array(NN*4);
  // wetness from erosion flow (log), boosted by drainage area; sediment from deposits
  const flow=T.flow,depo=T.depo,acc=T.acc;
  let fmax=1e-6,dmax=1e-6;
  if(flow){const tmp=Array.from(flow.filter(v=>v>0));tmp.sort((a,b)=>a-b);fmax=tmp.length?tmp[Math.floor(tmp.length*0.985)]:1;
    const t2=Array.from(depo.filter(v=>v>0));t2.sort((a,b)=>a-b);dmax=t2.length?t2[Math.floor(t2.length*0.98)]:1;}
  const lf=Math.log1p(fmax);
  for(let n=0;n<NN;n++){
    let w=flow?Math.log1p(flow[n])/lf:0;
    if(acc)w=Math.max(w,clamp(Math.log(acc[n])/Math.log(4000)-0.2,0,1)*0.8);
    data[n*4]=Math.round(clamp(w,0,1)*255);
    data[n*4+1]=Math.round(clamp(depo?depo[n]/dmax:0,0,1)*255);
    data[n*4+2]=Math.round(clamp(T.shore?T.shore[n]:0,0,1)*255);
    data[n*4+3]=0;// forest density, filled by vegetation
  }
  T.nrm=nrm;T.data=data;
}

// bilinear helpers on the inner map
function sampleH(T,x,z,arr){const N=T.N,cs=T.cs;let fx=x/cs-0.5,fz=z/cs-0.5;fx=clamp(fx,0,N-1.001);fz=clamp(fz,0,N-1.001);const i=fx|0,j=fz|0,u=fx-i,v=fz-j,H=arr||T.H,k=j*N+i;
  return H[k]*(1-u)*(1-v)+H[k+1]*u*(1-v)+H[k+N]*(1-u)*v+H[k+N+1]*u*v;}
function sampleWater(T,x,z){const N=T.N,cs=T.cs;const i=clamp(Math.round(x/cs-0.5),0,N-1),j=clamp(Math.round(z/cs-0.5),0,N-1);const k=(j*N+i)*4;return T.water?[T.water[k],T.water[k+3]]:[0,0];}

// ---- Vegetation placement (step 8). Instances: [x,y,z,scale, rot,tint,hash,variant]
async function genVegetation(p,T,y){
  const {N,cs,W,H}=T;const rng=mulberry32((p.seed|0)*977+5);const nf=makeNoise((p.seed|0)+777);
  const out={trees:[[],[],[],[],[]],rocks:[]};// tree types: 0 spruce,1 broadleaf,2 bush,3 pine,4 birch
  const ns=makeNoise((p.seed|0)+919);

// TIMBER CRANES — a wooden travelling gantry at every station and lorry bay attached to a sawmill or a wood workshop.
// At a sawmill it lifts row-bundles of logs off the yard stacks and lowers them onto the timber wagons standing
// alongside the 44 m yard (wagons beyond the yard are left alone); at a workshop it unloads them onto its stacks

  run(f,s,dt){const g=1.6*dt,tv=1.2*dt,hv=0.9*dt,mv=(k,to,step)=>{const d=to-s[k];if(Math.abs(d)<=step){s[k]=to;return true;}s[k]+=Math.sign(d)*step;return false;};

  update(dt){if(!App.T||!R.world){this.F=[];return;}const sp=+P.craneSpeed||2.5,F=this.frames(),live=new Set();this.hold.clear();

const Trains={list:[],sel:-1,parts:[],nextId:1,
  init(){const ms=[locoMesh(),tenderMesh(),coachMesh([0.72,0.20,0.17],[0.96,0.88,0.70]),coachMesh([0.20,0.48,0.34],[0.96,0.90,0.74]),signalMesh(),stationMesh(),wagonMesh(0),wagonMesh(1),wagonMesh(2),wagonMesh(3),loadStageMesh(),gantryMesh(),trolleyMesh(),cableMesh(),hookMesh(),logRowMesh(0),logRowMesh(1),logRowMesh(2),logRowMesh(0,true),logRowMesh(1,true),logRowMesh(2,true)];R.buildVehicleMeshes(ms);

  cur(){return this.list[this.sel]||null;},
  goodsConsist(n){const v=[{k:'loco',...VEH.loco,mesh:0},{k:'tender',...VEH.tender,mesh:1}],T=['grain','produce','mail','wood'];for(let i=0;i<Math.max(4,n+2);i++){const t=i%4;v.push({k:'wagon',...VEH.wagon,mesh:6+t,ctype:T[t],n:0});}return v;},

  add(at,vh){

      this.list.push(tr0);this.sel=this.list.length-1;this.place(tr0);UI.toast(`${tr0.name} is on the line`);Drive.refresh();return;}
    const tx=Cam.target[0],tz=Cam.target[2];let best=null,bd=1e9;

  remove(){if(this.sel<0)return;const t=this.list.splice(this.sel,1)[0];t.whistle=false;Sfx.whistle(t,false);this.sel=Math.min(this.sel,this.list.length-1);Log.info(`${t.name} removed`);Drive.refresh();},
  trackChanged(){const before=this.list.length;this.list=this.list.filter(t=>{let ok=!!segById(t.head.sid);let off=0;for(const v of t.veh){if(!ok)break;ok=!advance(t.head,-(off+v.len)).blocked||true;off+=v.len+COUPLE;}return ok;});

  // vehicle placement: two pivot points on the track give position, heading and pitch
  place(tr){let off=0;tr.poses=[];
    for(const v of tr.veh){const c=off+v.len/2;const f=posInfo(advance(tr.head,-(c-v.pf)).pos),r=posInfo(advance(tr.head,-(c-v.pr)).pos);off+=v.len+COUPLE;

    Log.info(`track earthworks rebuilt in ${(performance.now()-t0).toFixed(0)} ms (${Track.segs.length} pieces, ${Track.length().toFixed(0)} m)`);},
  save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot()));UI.toast('Saved');Log.info('saved to browser storage');}catch(e){Log.err('save failed '+e);UI.toast('Save failed: browser storage is blocked');}},
  load(){let s;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){s=null;}if(!s){UI.toast('No save found yet');return;}
    try{applySnapshot(s);this.camLoaded=true;this.generate(0);UI.toast('Save loaded');}catch(e){UI.toast(e.message);}},
  exportJSON(){const s=snapshot();if(this.T)s.world=this.T.stats;download(`trein-state-${stamp()}.json`,JSON.stringify(s,null,2));Log.info('state exported');UI.toast('JSON exported');},
  importJSON(file){const r=new FileReader();r.onload=()=>{try{applySnapshot(JSON.parse(r.result));this.camLoaded=true;this.generate(0);UI.toast('Imported '+file.name);}catch(e){Log.err('import failed '+e);UI.toast('Import failed: '+e.message);}};r.readAsText(file);},
  exportLog(){const s=snapshot();download(`trein-log-${stamp()}.txt`,Log.text()+'\n\n--- state ---\n'+JSON.stringify(s,null,1),'text/plain');UI.toast('Debug log exported');},
  resetAll(){if(!confirm('Reset every setting to its default and remove all track, trains and roads? This cannot be undone.'))return;for(const id of PORDER)P[id]=PDEF[id].def;Track.load(null);for(const t of Trains.list){t.whistle=false;Sfx.whistle(t,false);}Trains.list=[];Trains.sel=-1;
    // roads, bus stops, buses, village growth and money used to survive a reset
    Roads.list=[];Buses.stops=[];Buses.list=[];Buses.pending=0;Life.roadsDirty=true;Life.pendingV=null;Money.cash=200000;Money.loan=0;Money.paid=new Map();Money.paidSt=new Set();Money.paidTr=new Set();Money.inited=false;applyPreset(P.preset,true);UI.refreshAll();this.camLoaded=false;this.placedCam=false;R.setupShadows();this.generate(0);}
};

// ---- quick sky sheet: time, speed, season and weather without opening the settings
const Sky={bind(){$('#btnSky').onclick=()=>{const s=$('#skySheet');s.hidden=!s.hidden;this.refresh();};
    $('#skyTime').oninput=e=>{P.timeOfDay=+e.target.value;UI.refresh('timeOfDay');this.clock();};
    for(const b of document.querySelectorAll('#skySheet [data-speed]'))b.onclick=()=>{P.timeSpeed=+b.dataset.speed;UI.refresh('timeSpeed');this.refresh();};
    for(const b of document.querySelectorAll('#skySheet [data-season]'))b.onclick=()=>{P.season=b.dataset.season;UI.refresh('season');this.refresh();};
    for(const b of document.querySelectorAll('#skySheet [data-wx]'))b.onclick=()=>{P.weather=b.dataset.wx;UI.refresh('weather');if(P.weather==='auto')Weather.autoT=0;this.refresh();};
    $('#skyMusic').onclick=()=>{P.music=P.music?0:1;UI.refresh('music');if(P.music&&!Sfx.on){Sfx.start();Sfx.syncBtn();}this.refresh();};
    $('#skyClose').onclick=()=>{$('#skySheet').hidden=true;};},
  refresh(){const s=$('#skySheet');if(!s||s.hidden)return;$('#skyTime').value=P.timeOfDay;
    for(const b of s.querySelectorAll('[data-speed]'))b.classList.toggle('on',+b.dataset.speed===P.timeSpeed);
    for(const b of s.querySelectorAll('[data-season]'))b.classList.toggle('on',b.dataset.season===P.season);
    for(const b of s.querySelectorAll('[data-wx]'))b.classList.toggle('on',b.dataset.wx===P.weather);const mb=$('#skyMusic');mb.classList.toggle('on',!!P.music);setIcon(mb,P.music?'music':'musicOff');setCap(mb,P.music?'Music on':'Music off');},
  clock(){const h=Math.floor(P.timeOfDay),mi=Math.floor((P.timeOfDay-h)*60),z=n=>String(n).padStart(2,'0');const S=P.season[0].toUpperCase()+P.season.slice(1);
    const t=`${S} ${z(h)}:${z(mi)}, ${Weather.label()}`;const el=$('#clock');if(el&&el.textContent!==t)el.textContent=t;const b=$('#btnSky');if(b)b.textContent=`${z(h)}:${z(mi)}`;}};
// automatic resolution: drops the render scale (never above the chosen one) when the frame rate sags, e.g. when the phone heats up
const AutoRes={dyn:1,last:0,warned:false,
  tick(ts,fr){const tgt=+P.autoRes;if(!tgt){this.dyn=1;return;}if(fr.length<40||ts-this.last<3000)return;const a=fr.slice(-45),fps=1000/(a.reduce((x,y)=>x+y,0)/a.length),lo=0.4/clamp(+P.renderScale||1,0.3,1);
    if(fps<tgt*0.9&&this.dyn>lo){this.dyn=Math.max(lo,this.dyn*0.88);this.last=ts;if(this.dyn<0.8&&!this.warned){this.warned=true;UI.toast('Lowering resolution to keep it smooth (the phone may be warm)');}Log.info(`auto resolution ×${this.dyn.toFixed(2)} at ${fps.toFixed(0)} fps`);}
    else if(fps>tgt*1.3&&this.dyn<1){this.dyn=Math.min(1,this.dyn*1.06);this.last=ts+4000;}}};
function resizeCanvas(){const cv=gl.canvas,d=Math.min(devicePixelRatio||1,3)*clamp(+P.renderScale||1,0.3,1)*AutoRes.dyn,w=Math.max(64,Math.round(innerWidth*d)),h=Math.max(64,Math.round(innerHeight*d));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}}
let lastT=0,frameAcc=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(document.hidden)return;
  const raw=(ts-lastT)/1000;if(P.frameCap>0&&raw<1/P.frameCap-0.003&&lastT)return;
  const dt=lastT?Math.min(raw,0.1):0.016;lastT=ts;App.time+=dt;
  if(P.timeSpeed>0){const nt=P.timeOfDay+dt*P.timeSpeed/3600;if(nt>=24)Weather.newDay();P.timeOfDay=nt%24;if((frameAcc+=dt)>0.5){frameAcc=0;UI.refresh('timeOfDay');Sky.refresh();}}
  const c0=performance.now();
  resizeCanvas();keyMove(dt);Input.tick();TouchLog.tick(dt);if(App.T)Trains.update(Math.min(dt,0.05));Weather.update(dt);if(App.T)Life.update(dt);if(App.T)Crane.update(dt);if(Build.active)Build.edgePan(dt);Cam.update(dt);Sfx.update(dt);Drive.tick();
  R.ensureTargets(gl.canvas.width,gl.canvas.height);
  try{R.frame(Cam,App.time);}catch(e){Log.err('frame: '+(e.stack||e));throw e;}
  const cpu=performance.now()-c0,pf=App.perf;pf.fr.push(dt*1000);if(pf.fr.length>240)pf.fr.shift();pf.cpu=(pf.cpu||cpu)*0.95+cpu*0.05;
  AutoRes.tick(ts,pf.fr);{const dtm=Math.min(0.1,(ts-(pf.mlast||ts))/1000);Money.tick(dtm);Icons.tick(dtm);VillageUI.tick();IndUI.tick();if(App.T)Goods.tick(dtm);}pf.mlast=ts;if(ts-pf.hudAt>350){pf.hudAt=ts;const st=$('#stats');st.hidden=!P.showStats;
    if(P.showStats){const a=pf.fr.slice(-60),avg=a.reduce((x,y)=>x+y,0)/a.length;
      st.textContent=`${(1000/avg).toFixed(0)} fps   ${avg.toFixed(1)} ms   cpu ${pf.cpu.toFixed(1)} ms   draws ${Stats.draws}   tris ${(Stats.tris/1e6).toFixed(2)}M   ${R.tw}×${R.th}`;}
    Sky.clock();}
  if(ts-pf.logAt>10000){pf.logAt=ts;const a=pf.fr,avg=a.reduce((x,y)=>x+y,0)/a.length,worst=Math.max(...a);
    Log.info(`perf avg ${(1000/avg).toFixed(1)} fps (${avg.toFixed(1)} ms, worst ${worst.toFixed(0)} ms) cpu ${pf.cpu.toFixed(1)} ms draws ${Stats.draws} tris ${(Stats.tris/1e6).toFixed(2)}M chunks ${Stats.chunks} objects ${Stats.objs} target ${R.tw}x${R.th} msaa ${R.ms} preset ${P.preset} cam ${Cam.pos.map(v=>v.toFixed(0)).join(',')} ${P.season} ${P.timeOfDay.toFixed(1)}h ${Weather.name} walkers ${Life.walkers.length} particles ${Particles.n}`);}
  if(App.gpuCheck===undefined){App.gpuCheck=0;const e=gl.getError();if(e)Log.err('GL error after first frame 0x'+e.toString(16));}
}

async function boot(){
  UI.build();
  $('#btnMenu').onclick=()=>{$('#panel').classList.add('open');$('#bar').classList.add('hide');};
  $('#btnClose').onclick=()=>{$('#panel').classList.remove('open');$('#bar').classList.remove('hide');};
  $('#btnGen').onclick=()=>App.generate(0);$('#btnSave').onclick=()=>App.save();
  $('#btnBuild').onclick=()=>{if(!Sfx.on)Sfx.start();Sfx.syncBtn();Build.enter();};$('#btnDone').onclick=()=>Build.exit();$('#btnUndo').onclick=()=>Build.undo();
  const on=(sel,fn)=>{for(const b of document.querySelectorAll(sel))b.onclick=()=>fn(b);};
  on('#buildBar [data-mode]',b=>Build.setMode(b.dataset.mode));on('#buildBar [data-rtool]',b=>{Roads.tool=b.dataset.rtool;Roads.a=null;Build.ui();Build.hint();});$('#rStart').onclick=()=>{Roads.a=null;Build.hint();};$('#rAddBus').onclick=()=>Buses.add();$('#rAddLorry').onclick=()=>Buses.add(true);on('#buildBar [data-v]',b=>Build.setProfile(b.dataset.v));
  on('#buildBar [data-dir]',b=>Build.setDir(+b.dataset.dir));on('#buildBar [data-slope]',b=>Build.setSlope(b.dataset.slope));on('#buildBar [data-prefer]',b=>Build.setPrefer(b.dataset.prefer));
  $('#pLenMinus').onclick=()=>Build.addLen(-10);$('#pLenPlus').onclick=()=>Build.addLen(10);$('#pRotL').onclick=()=>Build.rotStart(1);$('#pRotR').onclick=()=>Build.rotStart(-1);
  $('#pNew').onclick=()=>Build.newLine();$('#pBranch').onclick=()=>Build.branchMode();$('#pDemolish').onclick=()=>Build.demolish();$('#pPlace').onclick=()=>Build.place();$('#rClear').onclick=()=>Build.routeClear();
  on('#buildBar [data-sig]',b=>Build.setSig(b.dataset.sig));$('#btnClearAll').onclick=()=>Build.clearAll();
  $('#cA').onclick=()=>Build.choose(Build.choice&&Build.choice.kind==='join'?'fix':'cross');$('#cB').onclick=()=>Build.choose(Build.choice&&Build.choice.kind==='join'?'asis':'junc');$('#cC').onclick=()=>Build.choose(Build.choice&&Build.choice.kind==='join'?'none':'cancel');
  $('#bBridges').onclick=()=>Build.toggle('trackBridges');{const nm=['Stone arch','Brick arch','Steel truss','Plate girder','Concrete','Timber trestle'],up=()=>{$('#bBridgeType').textContent=nm[+P.bridgeType|0];};up();$('#bBridgeType').onclick=()=>{P.bridgeType=((+P.bridgeType|0)+1)%6;UI.refresh('bridgeType');up();};}$('#bTunnels').onclick=()=>Build.toggle('trackTunnels');
  $('#btnRemove').onclick=()=>Build.toggleRemove();$('#btnBuildOK').onclick=()=>Build.confirm();$('#btnDiscard').onclick=()=>Build.discard();
  $('#btnDrive').onclick=()=>Drive.enter();$('#btnSound').onclick=()=>Sfx.toggle();Drive.bind();Sky.bind();Sfx.syncBtn();
  // sound and music pause while the tab is in the background (they used to keep playing with the screen off)
  document.addEventListener('visibilitychange',()=>{if(!Sfx.ctx)return;if(document.hidden)Sfx.ctx.suspend();else if(Sfx.on)Sfx.ctx.resume();});
  $('#errLog').onclick=()=>App.exportLog();
  try{
    for(let i=0;;i++){try{initGL($('#gl'));break;}catch(e){if(i>=5)throw new Error('Chrome would not start 3D graphics (WebGL2). This happens after the phone resets the graphics: close this tab completely (or force-stop Chrome) and open the file again.');
      Log.warn('WebGL2 not available yet, retry '+(i+1));const c=$('#gl'),n2=c.cloneNode();c.replaceWith(n2);await new Promise(r=>setTimeout(r,1500));}}
    await probeEnvironment();
    let saved=null,recovered=false;try{const rc=localStorage.getItem('trein.recover');if(rc){localStorage.removeItem('trein.recover');saved=JSON.parse(rc);recovered=true;}}catch(e){}
    if(!saved){try{saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){}}
    if(recovered){Log.warn('recovering after a graphics reset');if(saved.recoverLog)for(const l of saved.recoverLog)Log.info('(before reset) '+l);}
    if(saved){try{applySnapshot(saved);App.camLoaded=true;Log.info('restored last save');}catch(e){Log.warn('could not restore save: '+e.message);}}
    else applyPreset(P.preset,true);
    resizeCanvas();R.init();Trains.init();Particles.init();initInput(gl.canvas);
    requestAnimationFrame(loop);
    await App.generate(0);
    if(saved)UI.toast(recovered?'Recovered after a graphics reset':'Restored your last save');
  }catch(e){Log.err('boot failed: '+(e.stack||e));$('#err').hidden=false;$('#errMsg').textContent=String(e.message||e);UI.progress(false);}
}
window.TREIN={P,PDEF,Cam,R,App,Log,Stats,Track,Build,Trains,Drive,Sfx,Particles,Life,Weather,Music,Net,Clouds,Input,TouchLog};
boot();
